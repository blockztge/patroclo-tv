<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Patroclo TV (dev)</title>
  <script>
    // La API de Samsung (AVPlay) se carga acá, desde el paquete, antes de traer la app de la PC.
    if (window.tizen) document.write('<script src="$WEBAPIS/webapis/webapis.js"><\/script>');
  </script>
  <script src="server.js"></script>
  <style>
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #000; color: #fff;
      font-family: "SamsungOne", "TizenSans", "Segoe UI", Roboto, Arial, sans-serif; }
    #dev-status { position: absolute; left: 0; top: 0; width: 100%; height: 100%; padding: 8% 10%; box-sizing: border-box; }
    #dev-status h1 { font-size: 56px; margin: 0 0 10px; }
    #dev-status h1 span { color: #fbbf24; }
    #dev-msg { font-size: 28px; line-height: 1.5; color: rgba(255, 255, 255, .8); margin-bottom: 36px; max-width: 1300px; }
    #dev-help { font-size: 24px; line-height: 1.7; color: rgba(255, 255, 255, .6); margin-bottom: 36px; }
    #dev-form { display: none; }
    #dev-form.show { display: block; }
    #dev-server { display: block; width: 900px; font-size: 30px; padding: 16px 22px; margin-bottom: 20px;
      background: #000; color: #fff; border: 3px solid rgba(255, 255, 255, .25); border-radius: 12px; outline: none; }
    .dev-btn { font-size: 28px; font-weight: 700; padding: 16px 34px; margin-right: 16px; border-radius: 12px;
      border: 3px solid transparent; background: #27272a; color: #fff; }
    .dev-focus { border-color: #fbbf24 !important; }
    .dev-btn.dev-focus { background: #fff; color: #000; }
  </style>
</head>
<body>
  <div id="dev-status">
    <h1><span>Patroclo</span> TV · desarrollo</h1>
    <div id="dev-msg">Conectando con la PC…</div>
    <div id="dev-form">
      <div id="dev-help">
        Revisá que:<br>
        · XAMPP esté abierto en la PC con Apache encendido.<br>
        · La PC y el televisor estén en la misma red.<br>
        · El firewall de Windows deje entrar a Apache.
      </div>
      <input id="dev-server" type="text" autocomplete="off">
      <button id="dev-retry" class="dev-btn">Conectar</button>
      <button id="dev-exit" class="dev-btn">Salir</button>
    </div>
  </div>
  <script src="launcher.js"></script>
</body>
</html>

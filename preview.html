<title>Patroclo TV</title>
<link rel="stylesheet" href="css/app.css">
<style>
  /* Vista previa: la app es de un solo tema oscuro, como en el televisor. */
  :root { color-scheme: dark; background: #000; }
  html, body { background: #000; color: #fff; }
</style>

<div id="stage">
  <div id="app">
    <section id="setup" class="screen hidden"></section>
    <section id="shell" class="screen hidden">
      <header id="topbar">
        <div class="brand"><span class="accent">Patroclo</span> TV</div>
        <nav id="tabs"></nav>
        <div id="clock"></div>
      </header>
      <main id="content"></main>
    </section>
  </div>
  <div id="modal" class="layer hidden"></div>
  <div id="player" class="layer hidden"></div>
  <div id="loading" class="layer hidden">
    <div class="spinner"></div>
    <div id="loading-text"></div>
  </div>
  <div id="toast" class="hidden"></div>
</div>

<script src="js/core.js"></script>
<script src="js/sources.js"></script>
<script>
  // Solo para la vista previa web: acá no se puede descargar nada de internet,
  // así que solo funciona la lista incluida en la app.
  (function (P) {
    P.canProxy = function () { return false; };
    var load = P.loadSource;
    P.loadSource = function (cfg, cb) {
      if (cfg.kind === 'demo' && cfg.demoId === 'arc') return load(cfg, cb);
      cb(new Error('En esta vista previa solo funciona "Argentina completa", porque viene incluida en la app. Las demás fuentes, los logos y el video se cargan desde internet y funcionan en el televisor o en XAMPP.'));
    };
  })(PTV);
</script>
<script src="js/nav.js"></script>
<script src="js/player.js"></script>
<script>
  // En la vista previa web el video está bloqueado: avisar en lugar de intentar reproducir.
  (function (P) {
    P.player.open = function () {
      P.toast('En la vista previa no se puede reproducir video. Probalo en http://localhost/patroclo/ o en el televisor.', 6000);
    };
  })(PTV);
</script>
<script src="js/app.js"></script>
